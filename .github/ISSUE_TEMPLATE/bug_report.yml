name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: File / area affected
      placeholder: e.g. convex/auctions/mutations/bidding.ts, /pages/AuctionDetail
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low - cosmetic / minor annoyance
        - Medium - functional bug, has workaround
        - High - blocks core flow (bidding, listing, auth)
        - Critical - data loss / security
    validations:
      required: true
